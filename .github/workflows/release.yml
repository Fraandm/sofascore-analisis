name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build executable
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_installer.ps1 -SkipExe

      - name: Test installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\test_installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SofaScore-installer
          path: |
            SofaScore.exe
            dist-installer/*.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SofaScore ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SofaScore.exe
            dist-installer/*.exe
            dist-installer/SHA256SUMS.txt
